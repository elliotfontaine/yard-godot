---
name: Load YARD plugin
description: |
  "Run Godot in headless mode and load YARD. GDScript warning are treated as errors."

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.jpg"
      - "**.png"
      - "**.svg"
      - "**.md"
      - "**plugin.cfg"
  pull_request:
    paths-ignore:
      - "**.jpg"
      - "**.png"
      - "**.svg"
      - "**.md"
      - "**plugin.cfg"
  workflow_dispatch:

jobs:
  test:
    name: Godot ${{ matrix.version }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - "4.5.2"
          - "4.6.3"
          - "4.7.2"

        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.version }}
          use-dotnet: false

      - name: Check Godot version
        shell: bash
        run: |
          godot --version

      - name: Replace project.godot with test version
        shell: bash
        run: |
          cp test/project/test_project.godot project.godot

      - name: Run Godot with plugin
        shell: bash
        run: |
          set -o pipefail

          godot \
            --headless \
            --editor \
            --quit \
            2>&1 | tee godot.log

      - name: Check plugin loaded
        shell: bash
        run: |
          grep -F \
            "YARD - Yet Another Resource Database. Plugin loaded." \
            godot.log

      - name: Check for Godot errors or warnings
        shell: bash
        run: |
          if grep -E '(^| )(ERROR|WARNING)( |:)|SCRIPT ERROR|Parse Error' godot.log; then
            echo "::error::Godot reported an error or warning."
            exit 1
          fi
