name: Load YARD plugin

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.jpg"
      - "**.png"
      - "**.svg"
      - "**.md"
      - "**plugin.cfg"
  pull_request:
    paths-ignore:
      - "**.jpg"
      - "**.png"
      - "**.svg"
      - "**.md"
      - "**plugin.cfg"
  workflow_dispatch:

jobs:
  test:
    name: Godot ${{ matrix.version }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - "4.5.2"
          - "4.6.3"
          - "4.7.2"

        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.version }}
          use-dotnet: false

      - name: Check Godot version
        shell: bash
        run: |
          godot --version

      - name: Copy YARD to test project directory
        shell: bash
        run: |
          mkdir -p test/project/addons
          cp -R addons/yard test/project/addons/yard

      - name: Test plugin
        shell: bash
        run: |
          set -o pipefail

          godot \
            --headless \
            --path test/project \
            --editor \
            --quit \
            2>&1 | tee godot.log

      - name: Check plugin loaded
        shell: bash
        run: |
          grep -F \
            "YARD - Yet Another Resource Database. Plugin loaded." \
            godot.log

      - name: Check for Godot errors
        shell: bash
        run: |
          if grep -E \
            '(^| )ERROR( |:)|SCRIPT ERROR|Parse Error' \
            godot.log
          then
            echo "Godot reported an error."
            exit 1
          fi
